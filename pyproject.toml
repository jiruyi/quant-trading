[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading"
version = "0.1.0"
description = "Monster Quant: an A-share emotion and capital-flow research platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.14",
    "apscheduler>=3.10",
    "fastapi>=0.111",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
quant-trading = "quant_trading.cli:main"
monster-quant = "monster_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
