services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: monster_quant
      POSTGRES_USER: monster
      POSTGRES_PASSWORD: monster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:

